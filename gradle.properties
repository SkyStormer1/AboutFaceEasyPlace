org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod
mod_version=1.0.2
maven_group=com.skystormer
archives_base_name=aboutfaceeasyplace

# Toolchain
minecraft_version=26.2
loader_version=0.19.3
fabric_api_version=0.154.0+26.2
fabric_kotlin_version=1.13.12+kotlin.2.4.0

# Litematica is a hard dependency, but it is reached entirely by reflection rather than
# by linking against it, so this version is only what fabric.mod.json asks the loader for.
# 0.28.0 is the first Litematica release for Minecraft 26.x that carries EasyPlaceUtils.
litematica_version=0.28.0

# Compile-time only, for the settings screen. This is the build Litematica itself targets for 26.2.
modmenu_version=20.0.1

loom_version=1.16-SNAPSHOT
kotlin_version=2.4.0
