org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod
mod_version=1.2.0
maven_group=com.skystormer
archives_base_name=aboutfaceeasyplace

# Toolchain
minecraft_version=26.2
loader_version=0.19.3
fabric_api_version=0.161.0+26.2
fabric_kotlin_version=1.13.12+kotlin.2.4.0

# Litematica is a hard dependency, but it is reached entirely by reflection rather than
# by linking against it, so this version is only what fabric.mod.json asks the loader for.
# 0.28.0 is the first Litematica release for Minecraft 26.x that carries EasyPlaceUtils.
litematica_version=0.28.0

# Compile-time only, for the settings screen. The Mod Menu build for 26.2.
modmenu_version=20.0.1
# Compile-time only, for the block substitution hooks: CurseForge project and file ids of
# litematica-fabric-26.2-0.28.3 and malilib-fabric-26.2-0.29.3.
litematica_curse_project=308892
litematica_curse_file=8382374
malilib_curse_project=303119
malilib_curse_file=8401128

loom_version=1.16-SNAPSHOT
kotlin_version=2.4.0
